# pyproject.toml
# SPDX-License-Identifier: CC0-1.0
# This file was created by an AI model: openai/gpt-6.2-sol

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-sloppy-tools"
version = "0.3.0"
description = "Helpers and fixtures for pytest workflows"
readme = "README.md"
requires-python = ">=3.13"
license = "CC0-1.0"
license-files = ["LICENSE.txt"]
dependencies = ["pytest>=9,<10"]

[project.optional-dependencies]
cocotb = ["cocotb>=2.1.0"]

[project.entry-points.pytest11]
sloppy_tools = "pytest_sloppy_tools._parallel"

[dependency-groups]
dev = ["cocotb>=2.1.0", "pyrefly", "ruff"]
docs = ["furo", "myst-parser", "sphinx"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["I001", "BLE001"]

[tool.ruff.lint.isort]
force-single-line = true
from-first = false
length-sort = true
no-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
